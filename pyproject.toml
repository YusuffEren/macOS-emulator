[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempera-air"
version = "0.2.0"
description = "Clean-room open-source Android gaming environment for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tempera Air contributors" }]
keywords = ["android", "emulator", "apple-silicon", "macos", "avd", "adb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
android-sim = "android_simulator.cli:main"

[tool.setuptools.packages.find]
include = ["android_simulator*"]

[tool.setuptools.data-files]
"share/tempera-air" = ["engine/engine.lock.json"]
